# Main nginx config for all apps on port 80
# Location: /etc/nginx/sites-available/apps-proxy

server {
    listen 80;
    server_name 3.82.138.84 tsirigos.com www.tsirigos.com;

    # Homepage
    root /var/www/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    # =========================================================================
    # DFK Viewer - proxy all through Flask backend with URL rewriting
    # =========================================================================
    location /dfkviewer {
        return 301 /dfkviewer/;
    }
    # Serve viewer_data directly (large files, no rewriting needed)
    location /dfkviewer/viewer_data/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd-dfkviewer;
        alias /home/ubuntu/apps/dfkviewer/viewer_data/;
    }
    location /dfkviewer/ {
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd-dfkviewer;
        
        proxy_pass http://127.0.0.1:5002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        
        # Disable compression so sub_filter works
        proxy_set_header Accept-Encoding "";
        
        # Rewrite absolute URLs in responses
        sub_filter_types text/html text/css text/javascript application/javascript application/json;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/dfkviewer/';
        sub_filter "href='/" "href='/dfkviewer/";
        sub_filter 'src="/' 'src="/dfkviewer/';
        sub_filter "src='/" "src='/dfkviewer/";
        sub_filter '"/api/' '"/dfkviewer/api/';
        sub_filter "'/api/" "'/dfkviewer/api/";
        sub_filter 'fetch(`/' 'fetch(`/dfkviewer/';
        sub_filter 'fetch("/' 'fetch("/dfkviewer/';
        sub_filter "fetch('/" "fetch('/dfkviewer/";
    }

    # =========================================================================
    # Canvis - full reverse proxy with URL rewriting
    # =========================================================================
    location /canvis {
        return 301 /canvis/;
    }
    location /canvis/ {
        proxy_pass http://127.0.0.1:5006/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300;
        
        # Disable compression so sub_filter works
        proxy_set_header Accept-Encoding "";
        
        # Rewrite absolute URLs in responses (HTML, CSS, JS)
        sub_filter_types text/html text/css text/javascript application/javascript application/json;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/canvis/';
        sub_filter "href='/" "href='/canvis/";
        sub_filter 'src="/' 'src="/canvis/';
        sub_filter "src='/" "src='/canvis/";
        sub_filter 'action="/' 'action="/canvis/';
        sub_filter 'url(/' 'url(/canvis/';
        # API and static paths  
        sub_filter '"/api/' '"/canvis/api/';
        sub_filter "'/api/" "'/canvis/api/";
        sub_filter '"/static/' '"/canvis/static/';
        sub_filter "'/static/" "'/canvis/static/";
        # Fetch calls with template literals
        sub_filter 'fetch(`/' 'fetch(`/canvis/';
        sub_filter 'fetch("/' 'fetch("/canvis/';
        sub_filter "fetch('/" "fetch('/canvis/";
        # URL string assignments (catches let url = '/...')
        sub_filter "= '/get" "= '/canvis/get";
        sub_filter '= "/get' '= "/canvis/get';
        sub_filter "url + '/" "url + '/canvis/";
        sub_filter 'url + "/' 'url + "/canvis/';
    }

    # =========================================================================
    # Ash Image Bank - full reverse proxy with URL rewriting
    # =========================================================================
    location /ash-image-bank {
        return 301 /ash-image-bank/;
    }
    location /ash-image-bank/ {
        proxy_pass http://127.0.0.1:5003/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300;
        
        # Disable compression so sub_filter works
        proxy_set_header Accept-Encoding "";
        
        # Rewrite absolute URLs in responses
        sub_filter_types text/html text/css text/javascript application/javascript application/json;
        sub_filter_once off;
        sub_filter 'href="/' 'href="/ash-image-bank/';
        sub_filter "href='/" "href='/ash-image-bank/";
        sub_filter 'src="/' 'src="/ash-image-bank/';
        sub_filter "src='/" "src='/ash-image-bank/";
        sub_filter 'action="/' 'action="/ash-image-bank/';
        sub_filter 'url(/' 'url(/ash-image-bank/';
        sub_filter '"/api/' '"/ash-image-bank/api/';
        sub_filter "'/api/" "'/ash-image-bank/api/";
        sub_filter '"/static/' '"/ash-image-bank/static/';
        sub_filter "'/static/" "'/ash-image-bank/static/";
        sub_filter 'fetch("/' 'fetch("/ash-image-bank/';
        sub_filter "fetch('/" "fetch('/ash-image-bank/";
    }

    # =========================================================================
    # Nutrition Game - with URL rewriting for subpath
    # =========================================================================
    location /nutritiongame {
        return 301 /nutritiongame/;
    }
    location /nutritiongame/ {
        # Basic auth
        auth_basic "Restricted";
        auth_basic_user_file /etc/nginx/.htpasswd-nutritiongame;
        
        proxy_pass http://127.0.0.1:5100/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        
        # Disable compression so sub_filter works
        proxy_set_header Accept-Encoding "";
        
        # Rewrite absolute URLs in responses
        sub_filter_types text/html text/css text/javascript application/javascript application/json;
        sub_filter_once off;
        sub_filter 'href="/static/' 'href="/nutritiongame/static/';
        sub_filter "href='/static/" "href='/nutritiongame/static/";
        sub_filter 'src="/static/' 'src="/nutritiongame/static/';
        sub_filter "src='/static/" "src='/nutritiongame/static/";
        sub_filter '"images/' '"/nutritiongame/images/';
        sub_filter "'images/" "'/nutritiongame/images/";
        # Image paths with leading slash (from API JSON responses)
        sub_filter '"/images/' '"/nutritiongame/images/';
        sub_filter "'/images/" "'/nutritiongame/images/";
        # API paths
        sub_filter "fetch('/api/" "fetch('/nutritiongame/api/";
        sub_filter 'fetch("/api/' 'fetch("/nutritiongame/api/';
        sub_filter 'fetch(`/api/' 'fetch(`/nutritiongame/api/';
    }
}
